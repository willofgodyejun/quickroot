<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길찾기 3사 비교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d6dce3;
  --sign:#0b4f8a; --sign-ink:#ffffff;
  --ok:#1f9d55; --slow:#e0a100; --jam:#d93a2f; --none:#b7c0ca;
  --a1:#0b4f8a; --a2:#6a3fb5; --a3:#0e8a7b; --err:#b42318;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf3; --muted:#93a1b0; --line:#2a3642;
  --sign:#1c6cb3; --ok:#38c172; --slow:#f2b632; --jam:#f0584c; --none:#4a5866;
  --a1:#5aa2e6; --a2:#a685e8; --a3:#3cc3b0; --err:#ff8a80; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
.note{font-size:13px;color:var(--muted);margin:2px 0 0}
.sign{background:var(--sign);color:var(--sign-ink);border-radius:10px;padding:16px;display:grid;
  grid-template-columns:1fr auto 1fr 150px auto;gap:10px;align-items:end}
.sign label{display:block;font-size:12px;letter-spacing:.06em;opacity:.85;margin-bottom:4px}
.sign input{width:100%;font:inherit;padding:10px 12px;border-radius:6px;border:2px solid transparent;background:#fff;color:#15202b}
.sign input:focus{outline:none;border-color:#ffd54a}
.swap,.go{font:inherit;border:0;border-radius:6px;cursor:pointer;padding:10px 14px;font-weight:700}
.swap{background:rgba(255,255,255,.15);color:var(--sign-ink)}
.go{background:#ffd54a;color:#15202b}
.go:disabled{opacity:.6;cursor:wait}
.swap:focus-visible,.go:focus-visible,a:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
.summary{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}
.summary strong{font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.best{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%}
.name{font-weight:700;font-size:16px}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.live{border-color:var(--ok);color:var(--ok)}
.pill{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ok);color:#fff}
.eta{font-family:var(--font-num);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.eta small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
.arrive{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--muted)}
.stats b{display:block;font-family:var(--font-num);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.strip{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--line)}
.strip span{display:block;height:100%}
.ratio{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.route{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.route li{display:flex;gap:8px;align-items:center;min-width:0}
.route .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route .st{width:8px;height:8px;border-radius:50%;flex:none}
.route .km{margin-left:auto;font-family:var(--font-num);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.open{font-size:13px;color:var(--a1);text-decoration:none;margin-top:auto}
.open.off{color:var(--muted)}
.msg{font-size:14px;color:var(--muted)}
.msg.err{color:var(--err)}
.foot{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .sign{grid-template-columns:1fr auto}
  .sign .f-start{grid-column:1/2}.sign .swap{grid-row:1;grid-column:2;align-self:end}
  .sign .f-end,.sign .f-time,.sign .go{grid-column:1/-1}
  .grid{grid-template-columns:1fr}
  .legend{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>네이버지도 · 카카오맵 · 티맵 길찾기 비교</h1>
    <p class="note" id="statusNote">연동 상태를 확인하는 중…</p>
  </header>

  <form class="sign" id="form" autocomplete="off">
    <div class="f-start"><label for="start">출발</label><input id="start" list="places" value="킨텍스" required></div>
    <button type="button" class="swap" id="swap" aria-label="출발지와 도착지 바꾸기">⇅</button>
    <div class="f-end"><label for="end">도착</label><input id="end" list="places" value="강남역" required></div>
    <div class="f-time"><label for="time">출발 시각</label><input id="time" type="time"></div>
    <button type="submit" class="go" id="go">비교하기</button>
    <datalist id="places"></datalist>
  </form>

  <section class="summary" aria-live="polite">
    <strong id="sumText"></strong>
    <span id="sumSub" class="note"></span>
    <div class="legend"><span><i style="background:var(--ok)"></i>원활</span><span><i style="background:var(--slow)"></i>서행</span><span><i style="background:var(--jam)"></i>정체</span><span><i style="background:var(--none)"></i>정보 없음</span></div>
  </section>

  <section class="grid" id="grid"></section>

  <p class="foot">'실시간' 표시가 있는 카드만 실제 API 응답이고, '샘플' 카드는 연동 전 시뮬레이션 값입니다. 유류비는 연비 12km/L, 휘발유 1,690원/L 기준 추정치예요.</p>
</div>

<script>
const PLACES={
 "서울역":[37.5547,126.9707],"강남역":[37.4979,127.0276],"잠실역":[37.5133,127.1001],"여의도역":[37.5215,126.9243],
 "홍대입구역":[37.5572,126.9245],"판교역":[37.3948,127.1112],"수원역":[37.2665,127.0002],"킨텍스":[37.6688,126.7451],
 "인천공항 제1여객터미널":[37.4492,126.4508],"김포공항":[37.5587,126.7945],"광화문":[37.5759,126.9768],"동탄역":[37.2001,127.0957],
 "고양시청":[37.6584,126.8320],"성수역":[37.5446,127.0559],"부천역":[37.4840,126.7827]
};
const ROADS=["올림픽대로","강변북로","자유로","서울외곽순환고속도로","경부고속도로","동부간선도로","내부순환로","분당수서로",
 "제2경인고속도로","인천공항고속도로","강남대로","테헤란로","남부순환로","서부간선도로","용인서울고속도로","경인고속도로"];
const HIGHWAY=/고속도로/;
const APPS=[
 {id:"naver",name:"네이버지도",color:"var(--a1)",circ:1.30,bias:0.00,link:(s,e)=>`https://map.naver.com/p/search/${encodeURIComponent(e)}`},
 {id:"kakao",name:"카카오맵",color:"var(--a2)",circ:1.27,bias:0.03,link:(s,e)=>`https://map.kakao.com/?sName=${encodeURIComponent(s)}&eName=${encodeURIComponent(e)}`},
 {id:"tmap",name:"티맵",color:"var(--a3)",circ:1.33,bias:-0.05,link:null}
];
let LIVE={kakao:false,naver:false,tmap:false};

const $=id=>document.getElementById(id);
Object.keys(PLACES).forEach(p=>{const o=document.createElement("option");o.value=p;$("places").appendChild(o)});
const pad=n=>String(n).padStart(2,"0");
(()=>{const d=new Date();$("time").value=`${pad(d.getHours())}:${pad(d.getMinutes())}`})();

// ---- 출발 시각 → 카카오 departure 파라미터 ----
function departureInfo(t){
  const now=new Date();const [h,m]=t.split(":").map(Number);
  const d=new Date(now);d.setHours(h,m,0,0);
  const diff=(d-now)/60000;
  if(Math.abs(diff)<=5) return {param:"now",date:now,label:"지금 출발"};
  if(diff<-5) d.setDate(d.getDate()+1);
  const param=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}`;
  const tomorrow=d.getDate()!==now.getDate();
  return {param,date:d,label:`${tomorrow?"내일 ":""}${pad(d.getHours())}:${pad(d.getMinutes())} 출발`};
}

// ---- 시뮬레이션 (연동 전 앱) ----
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function coord(name,known){if(known)return known;const k=name.trim();if(PLACES[k])return PLACES[k];const r=rng(hash(k));return[37.35+r()*0.4,126.75+r()*0.45]}
function km(a,b){const R=6371,d=x=>x*Math.PI/180;const dLa=d(b[0]-a[0]),dLo=d(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(d(a[0]))*Math.cos(d(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function rush(date){const x=date.getHours()+date.getMinutes()/60;
  if(x>=7&&x<9.5)return .75;if(x>=17&&x<20)return .8;if(x>=11&&x<14)return .45;if(x>=23||x<6)return .1;return .35}
const SPEED={ok:62,slow:28,jam:11};
function simulate(app,s,e,date,coords){
  const straight=Math.max(km(coord(s,coords?.o),coord(e,coords?.d)),1.5);
  const r=rng(hash(s+"|"+e+"|"+app.id));
  const dist=straight*(app.circ+r()*0.08);
  const load=Math.min(.95,Math.max(.05,rush(date)+app.bias+(r()-.5)*.1));
  const pool=[...ROADS].sort(()=>r()-.5);
  const n=Math.min(4,Math.max(2,Math.round(dist/12)+1));
  const legs=[];let left=dist;
  for(let i=0;i<n;i++){const len=i===n-1?left:Math.max(.8,left*(.25+r()*.35));left-=len;
    const p=r();legs.push({road:pool[i],len,st:p<load*.45?"jam":p<load*.95?"slow":"ok"})}
  const cells=[];legs.forEach(l=>{for(let i=0;i<Math.max(1,Math.round(l.len));i++){const q=r();cells.push(q<.6?l.st:(q<.8?"slow":(load>.5?"jam":"ok")))}});
  let min=3+r()*3;const seg=dist/cells.length;cells.forEach(st=>min+=seg/SPEED[st]*60);
  const strip=cells.map(st=>({st,w:1/cells.length}));
  const share={ok:0,slow:0,jam:0,none:0};strip.forEach(x=>share[x.st]+=x.w);
  const toll=legs.some(l=>HIGHWAY.test(l.road))?Math.round((900+dist*45)/100)*100:0;
  return{source:"sample",dist,min:Math.round(min),toll,strip,share,legs};
}

// ---- 렌더링 ----
const won=n=>n?n.toLocaleString("ko-KR")+"원":"무료";
const fuel=d=>Math.round(d/12*1690/100)*100;
const STC={ok:"var(--ok)",slow:"var(--slow)",jam:"var(--jam)",none:"var(--none)"};
const STN={ok:"원활",slow:"서행",jam:"정체",none:"정보 없음"};
const fmt=m=>m>=60?`${Math.floor(m/60)}<small>시간</small> ${m%60}<small>분</small>`:`${m}<small>분</small>`;
const arrival=(date,m)=>{const d=new Date(date.getTime()+m*60000);return `${pad(d.getHours())}:${pad(d.getMinutes())} 도착 예정`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(app,r,ctx,best){
  const link=app.link?`<a class="open" href="${app.link(ctx.s,ctx.e)}" target="_blank" rel="noopener">${app.name}에서 열기 ↗</a>`:`<span class="open off">티맵은 모바일 앱에서 확인</span>`;
  const head=`<div class="head"><span class="dot" style="background:${app.color}"></span><span class="name">${app.name}</span>
    <span class="tag ${r&&r.source!=="sample"?"live":""}">${r&&r.source!=="sample"?"실시간":"샘플"}</span>${best?'<span class="pill">최단 시간</span>':""}</div>`;
  if(r==="loading") return head+`<p class="msg">경로를 불러오는 중…</p>`;
  if(r&&r.error) return head+`<p class="msg err">${esc(r.error)}</p>${link}`;
  const pc=k=>Math.round(r.share[k]*100);
  return head+`
   <div><div class="eta">${fmt(r.min)}</div><div class="arrive">${arrival(ctx.date,r.min)}</div></div>
   <div class="stats"><div>거리<b>${r.dist.toFixed(1)}km</b></div><div>통행료<b>${won(r.toll)}</b></div><div>예상 유류비<b>${won(fuel(r.dist))}</b></div></div>
   <div><div class="strip" role="img" aria-label="정체 현황: 원활 ${pc("ok")}%, 서행 ${pc("slow")}%, 정체 ${pc("jam")}%">${r.strip.map(x=>`<span style="flex:${x.w};background:${STC[x.st]}"></span>`).join("")}</div>
   <div class="ratio"><span>원활 ${pc("ok")}%</span><span>서행 ${pc("slow")}%</span><span>정체 ${pc("jam")}%</span>${pc("none")?`<span>정보 없음 ${pc("none")}%</span>`:""}</div></div>
   <ol class="route">${r.legs.map(l=>`<li><span class="st" style="background:${STC[l.st]}" title="${STN[l.st]}"></span><span class="rn">${esc(l.road)}</span><span class="km">${l.len.toFixed(1)}km</span></li>`).join("")}</ol>
   ${link}`;
}

function draw(results,ctx){
  const ok=APPS.filter(a=>results[a.id]&&results[a.id].min!=null);
  const best=ok.length?ok.reduce((x,y)=>results[y.id].min<results[x.id].min?y:x):null;
  const g=$("grid");g.innerHTML="";
  APPS.forEach(a=>{const c=document.createElement("article");c.className="card"+(best===a&&ok.length>1?" best":"");
    c.innerHTML=card(a,results[a.id],ctx,best===a&&ok.length>1);g.appendChild(c)});
  if(best&&ok.length>1){
    const worst=ok.reduce((x,y)=>results[y.id].min>results[x.id].min?y:x);
    const gap=results[worst.id].min-results[best.id].min;
    const mixed=ok.some(a=>results[a.id].source==="sample");
    $("sumText").textContent=`${ctx.s} → ${ctx.e}: ${best.name}가 가장 빨라요`;
    $("sumSub").textContent=`${gap>0?`${worst.name}보다 ${gap}분 빠름`:"세 앱 예상 시간이 같아요"} · ${ctx.label}${mixed?" · 샘플 값이 섞인 비교":""}`;
  } else {
    $("sumText").textContent=`${ctx.s} → ${ctx.e}`;$("sumSub").textContent=ctx.label;
  }
}

async function run(){
  const s=$("start").value.trim(),e=$("end").value.trim();if(!s||!e)return;
  const dep=departureInfo($("time").value||`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`);
  const ctx={s,e,date:dep.date,label:dep.label};
  const results={};
  APPS.forEach(a=>results[a.id]=LIVE[a.id]?"loading":simulate(a,s,e,dep.date));
  draw(results,ctx);
  if(!LIVE.kakao)return;
  $("go").disabled=true;
  try{
    const res=await fetch(`/api/route/kakao?${new URLSearchParams({from:s,to:e,departure:dep.param})}`);
    const body=await res.json();
    if(!res.ok)throw new Error(body.error||`오류 ${res.status}`);
    results.kakao=body.route;
    // 실제 좌표를 알았으니 샘플 카드도 같은 좌표로 다시 계산
    const coords={o:[body.origin.y,body.origin.x],d:[body.destination.y,body.destination.x]};
    APPS.forEach(a=>{if(!LIVE[a.id])results[a.id]=simulate(a,s,e,dep.date,coords)});
    ctx.label+=` · ${body.origin.name} → ${body.destination.name}`;
  }catch(err){results.kakao={error:err.message}}
  finally{$("go").disabled=false}
  draw(results,ctx);
}

$("form").addEventListener("submit",ev=>{ev.preventDefault();run()});
$("swap").addEventListener("click",()=>{const a=$("start"),b=$("end");[a.value,b.value]=[b.value,a.value];run()});

fetch("/api/status").then(r=>r.json()).then(st=>{LIVE=st}).catch(()=>{}).finally(()=>{
  const on=APPS.filter(a=>LIVE[a.id]).map(a=>a.name);
  $("statusNote").textContent=on.length?`실시간 연동: ${on.join(", ")} · 나머지는 샘플 값`:"아직 연동된 앱이 없어 모든 카드가 샘플 값이에요. .env에 API 키를 넣고 서버를 다시 켜 주세요.";
  run();
});
</script>
</body>
</html>
